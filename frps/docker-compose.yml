services:
  frps:
    image: ghcr.io/fatedier/frps:v0.70.0
    container_name: frps
    restart: unless-stopped
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    command: -c /etc/frp/frps.toml
    ports:
      - "7000:7000"      # bindPort:frpc 连接(TCP)
      - "7000:7000/udp"  # bindUDPPort:xtcp P2P 打洞协调(UDP)
      - "7500:7500"      # dashboard 管理面板
      - "${FRPS_VHOST_HTTP_PORT:-8080}:${FRPS_VHOST_HTTP_PORT:-8080}"    # vhostHTTPPort:NPM 转发目标
