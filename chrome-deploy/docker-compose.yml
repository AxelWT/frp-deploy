services:
  chromium:
    image: lscr.io/linuxserver/chromium:b1ee1dc8-ls55
    container_name: chromium
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined     # Chromium 沙箱在 Docker 内需要
    shm_size: "1gb"            # 过小会导致重负载页面(视频)标签页崩溃
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - TITLE=Chrome           # 网页 UI 标签标题
      - PIXELFLUX_WAYLAND=true # Chromium 走原生 Wayland,避免启动时 Xwayland 未就绪导致应用秒退(黑屏)
      - CUSTOM_USER=${CHROME_USER}       # 容器层 HTTP Basic Auth
      - PASSWORD=${CHROME_PASSWORD}
      - CHROME_CLI=${CHROME_CLI}         # .env 提供;当前 --enable-wayland-ime,Chromium 接入 Wayland 输入法必需
      # --- fcitx5 中文输入法(绕开 Selkies 键盘事件通道丢字,远端会话内直接打中文) ---
      # DOCKER_MODS 让容器每次启动时以 root 自动 apt 安装 INSTALL_PACKAGES(| 分隔),recreate 后自动重装
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=fcitx5|fcitx5-chinese-addons|fcitx5-frontend-gtk3|fcitx5-frontend-gtk4|fonts-noto-cjk
      - GTK_IM_MODULE=fcitx   # GTK 应用走 fcitx 前端
      - QT_IM_MODULE=fcitx
      - XMODIFIERS=@im=fcitx
    volumes:
      - ./config:/config       # 浏览器 profile/下载持久化,可直接在 Finder 访问
    ports:
      - "127.0.0.1:3000:3000"  # 仅本机回环;frpc 经 host.docker.internal 访问(已验证可行)
